name: Build BrianXtream APK

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'app/src/**'
      - '.github/workflows/build-brianxtream.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant permission
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew tasks --all.
              
      - name: Find APK
        if: always()
        run: find app/build/outputs -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BrianXtream-APK
          path: path: app/build/outputs/apk/**/*.apk
          
